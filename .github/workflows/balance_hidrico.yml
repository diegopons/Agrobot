name: Balance Hídrico — todos los lotes

# ============================================================================
# CUÁNDO SE EJECUTA
# ============================================================================
on:
  schedule:
    # OJO: GitHub usa siempre horario UTC. Argentina = UTC-3.
    # 1) Corrida diaria completa: todos los lotes activos de todos los
    #    usuarios, con los días nuevos. 09:00 UTC = 06:00 en Argentina, cuando
    #    la estación del INTA ya consolidó el dato del día.
    - cron: "0 9 * * *"
    # 2) Cada hora: solo lotes nuevos o modificados desde el tablero, para que
    #    el usuario no tenga que esperar al día siguiente para ver su lote.
    - cron: "30 * * * *"

  # Manual, con un botón en la pestaña "Actions" del repo.
  workflow_dispatch:
    inputs:
      lote_id:
        description: "Id del lote (vacío = todos). Se copia del tablero o de Supabase"
        required: false
        type: string
      fecha_fin:
        description: "Calcular hasta esta fecha (AAAA-MM-DD). Vacío = hasta donde haya datos"
        required: false
        type: string
      reiniciar_estado:
        description: "Recalcular desde la siembra (solo con un lote indicado)"
        required: false
        type: boolean
        default: false
      enviar_resumen:
        description: "Enviar el resumen por Telegram aunque no haya días nuevos"
        required: false
        type: boolean
        default: false

# Dos corridas a la vez sobre los mismos lotes podrían escribir el mismo día
# dos veces; la segunda espera a que termine la primera.
concurrency:
  group: balance-hidrico
  cancel-in-progress: false

permissions:
  contents: read
  actions: write     # solo para el paso que mantiene activo el horario

jobs:
  balance-hidrico:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ---------------------------------------------------------------
      # Las credenciales llegan desde los "Secrets" del repositorio,
      # nunca escritas en el código. Los resultados se guardan en
      # Supabase, no en el repositorio: el repo es público y los lotes
      # de cada usuario no.
      # ---------------------------------------------------------------
      - name: Ejecutar balance hídrico
        env:
          BH_ALMACEN: supabase
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
          CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}
          CDSAPI_URL: ${{ secrets.CDSAPI_URL }}
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Aviso de pedidos de acceso por correo (Gmail + contraseña de aplicación)
          SMTP_USUARIO: ${{ secrets.SMTP_USUARIO }}
          SMTP_CLAVE: ${{ secrets.SMTP_CLAVE }}
          BH_SOLO_PENDIENTES: ${{ github.event.schedule == '30 * * * *' }}
          BH_LOTE_ID: ${{ inputs.lote_id }}
          BH_FECHA_FIN: ${{ inputs.fecha_fin }}
          BH_REINICIAR_ESTADO: ${{ inputs.reiniciar_estado }}
          BH_ENVIAR_RESUMEN: ${{ inputs.enviar_resumen }}
        run: python -m src.main

      # GitHub desactiva los horarios de un repo público tras 60 días sin
      # actividad. Antes los mantenía vivos el commit diario de resultados;
      # ahora los resultados van a Supabase, así que se vuelve a habilitar el
      # workflow por la API en cada corrida diaria.
      - name: Mantener activo el horario
        if: github.event_name == 'schedule' && github.event.schedule == '0 9 * * *'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/balance_hidrico.yml/enable"

      # El log queda descargable desde la pestaña Actions. No se publica en
      # el repo: nombra lotes y usuarios.
      - name: Guardar el log de la corrida
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-balance-hidrico
          path: logs/
          retention-days: 14
          if-no-files-found: ignore
