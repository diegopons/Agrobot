# =============================================================================
# Configuración del Balance Hídrico Periódico - Lote 20
# =============================================================================

aoi:
  # Puede ser un .geojson (recomendado: se edita desde el navegador y lo
  # genera la página docs/lote.html) o un .shp con sus archivos asociados.
  archivo: "aoi/lote.geojson"

campana:
  fecha_siembra: "2026-05-28"      # usada solo la primera vez (estado inicial)
  au_real_inicial_mm: 40.0
  prof_raiz_inicial_cm: 1

balance:
  umbral_riego_pct: 50
  incremento_raiz_diario_cm: 2.0
  prof_raiz_max_cm: 200
  kc_a: 1.77
  kc_b: -0.198

  # Al profundizar, la raíz alcanza agua que ya estaba almacenada en la capa
  # nueva. Sin esto el lote aparece cada vez más seco a medida que crece el
  # cultivo (era el desvío principal contra la planilla BH p-Pons).
  recarga_por_capa: true

  # Cuánta agua útil se supone que tiene cada capa al momento de la siembra,
  # como % de su agua útil máxima. Es una suposición: si hay calicata, cargar
  # `agua_inicial_mm` por capa en la sección `suelo` y este valor se ignora.
  llenado_inicial_pct: 70

  # Lluvias de este tamaño o mayores se descuentan por escurrimiento con
  # 2,43 · Pp^0,667 (USDA-SCS), igual que la planilla. Para usar la lluvia
  # caída completa, poner un número muy alto (por ejemplo 9999).
  umbral_lluvia_efectiva_mm: 15

  # Profundización de la raíz. Si se define esta tabla (días desde siembra,
  # profundidad en cm) se interpola entre los puntos y se ignora
  # `incremento_raiz_diario_cm`. Los valores de abajo son los de la planilla
  # BH p-Pons para trigo: arranque lento y profundización rápida después.
  # Comentar la tabla para volver al crecimiento lineal.
  prof_raiz_por_dds:
    - [0, 1]
    - [42, 40]
    - [52, 60]
    - [61, 80]
    - [69, 100]
    - [77, 120]
    - [84, 140]
    - [91, 160]
    - [99, 200]

# Cuántos días de "colchón" se dejan antes de hoy al pedir datos nuevos.
# Sentinel-2 en CDSE está casi en tiempo real (1-2 días); AgERA5 (CDS) suele
# tener un rezago de ~7-10 días hasta la versión "final". Se usa el mayor de
# los dos rezagos para no pedir un rango que todavía no tiene datos.
rezago_dias:
  ndvi: 2
  clima: 10            # AgERA5
  clima_openmeteo: 1   # Open-Meteo entrega hasta ayer
  clima_siga: 2        # la estación consolida el diario con 1-2 días

# ---------------------------------------------------------------------------
# Fuente de datos climáticos
# ---------------------------------------------------------------------------
clima:
  # Fuentes en orden de prioridad. Cada día toma el dato de la primera que lo
  # tenga; si una falla, se sigue con la siguiente sin tumbar la corrida.
  # El CSV guarda en qué fuente salió cada valor (fuente_pp / fuente_eto).
  #   siga       pluviómetro del INTA (medido, lo más cercano al lote)
  #   openmeteo  grilla ~9 km, llega hasta ayer, además da pronóstico
  #   agera5     reanálisis Copernicus, homogéneo pero ~10 días de atraso
  fuentes:
    - siga
    - openmeteo

  zona_horaria: "America/Argentina/Cordoba"

  siga:
    # Vacío = se elige automáticamente la estación más cercana al lote.
    # Para el lote de Manfredi, A872907 ("Manfredi - EEA Manfredi") está a 930 m.
    estacion_id:
    max_km: 50
    # Coeficiente de radiación de FAO-56 ec. 50: 0,16 interior, 0,19 costa.
    # La estación no mide radiación, así que la ETo se calcula con Rs estimada
    # a partir de la amplitud térmica. Validado contra Open-Meteo: −5 % en 21
    # días, con 0,43 mm/día de error absoluto medio.
    krs: 0.16

  # Modelo del archivo histórico de Open-Meteo. Vacío = "best_match": empalma
  # ERA5 con el modelo de pronóstico y llega hasta hoy. "era5" da reanálisis
  # puro, pero con ~7 días de rezago y grilla más gruesa.
  modelo_archivo:

# ---------------------------------------------------------------------------
# Pronóstico (solo con fuente "openmeteo")
# ---------------------------------------------------------------------------
# Proyecta el balance hacia adelante con la lluvia y ETo pronosticadas, para
# avisar que el lote va a cruzar el umbral antes de que ocurra. No modifica el
# estado ni el CSV: es una simulación aparte.
pronostico:
  habilitado: true
  dias: 10          # máximo 16; cuanto más largo, menos confiable
  # Ventana para la lámina "ajustada": solo se descuenta la lluvia
  # pronosticada dentro de estos días. Corta a propósito — descontar una
  # lluvia de 8 días que después no cae deja al cultivo en estrés.
  dias_descuento: 3


rutas:
  estado_json: "data/estado.json"
  salida_csv: "data/balance_hidrico_lote20.csv"
  # Resumen compacto para agentes conversacionales (n8n, bots).
  # Se publica en GitHub Pages junto al tablero.
  estado_json_publico: "docs/estado_actual.json"
  log_file: "logs/balance_hidrico.log"

# ---------------------------------------------------------------------------
# Copernicus Data Space Ecosystem (NDVI vía Sentinel Hub Statistical API)
# ---------------------------------------------------------------------------
# Credenciales: NO se escriben acá. Se leen de variables de entorno:
#   CDSE_CLIENT_ID
#   CDSE_CLIENT_SECRET
# Crearlas en: https://shapps.dataspace.copernicus.eu/dashboard/
cdse:
  # Filtro de nube de la ESCENA completa (la imagen entera, no el lote).
  # El enmascarado real se hace píxel a píxel con la banda SCL dentro del
  # evalscript, así que un umbral bajo acá solo descarta pasadas en las que
  # el lote podía estar despejado. 90 deja entrar casi todo y deja que el
  # filtro por píxel y el de cobertura decidan.
  max_cloud_coverage: 90
  resolucion_m: 10

  # Porcentaje mínimo del lote con píxeles válidos para aceptar una fecha.
  # Con menos que esto, el promedio describe la parte despejada y no el lote:
  # conviene descartar la fecha y dejar que la interpolación cubra el hueco.
  min_pixeles_validos_pct: 70

  # Si el hueco entre dos imágenes supera estos días, se interpola igual
  # pero queda un aviso en el log: en ese tramo la curva es una suposición.
  max_dias_interpolar: 30

  # Clases de la banda SCL que se aceptan como dato del lote. Es una lista
  # BLANCA: lo que no esté acá queda afuera del promedio y tampoco cuenta
  # para el porcentaje de cobertura.
  #
  #   0 sin datos           4 vegetación        8 nube, prob. media
  #   1 saturado/defectuoso 5 suelo desnudo     9 nube, prob. alta
  #   2 píxel oscuro/sombra 6 AGUA             10 cirros delgados
  #   3 sombra de nube      7 sin clasificar   11 nieve o hielo
  #
  # 4 y 5 son las dos clases que describen un lote: con cultivo y sin
  # cultivo. Agregar 7 ("sin clasificar") si se ve que el clasificador
  # descarta demasiado, pero sabiendo que es la clase donde caen los
  # píxeles raros.
  scl_validas: [4, 5]

  # Piso de plausibilidad para el NDVI medio del lote. Por debajo de este
  # valor la fecha se descarta: sobre una superficie agrícola un promedio
  # negativo no es una medición baja, es un síntoma de que al promedio
  # entró algo que no es el lote (agua, sombra, píxeles sin dato). Cero es
  # el único umbral que no puede descartar un dato legítimo: ni el suelo
  # desnudo más húmedo da negativo.
  ndvi_minimo_valido: 0.0

# ---------------------------------------------------------------------------
# Copernicus Climate Data Store (precipitación + ETo vía AgERA5)
# ---------------------------------------------------------------------------
# Credenciales: en ~/.cdsapirc (ver README.md).
# `request_template` se copia tal cual del botón "Show API request" en:
#   https://cds.climate.copernicus.eu/datasets/sis-agrometeorological-indicators
# (Se completan year/month/day/area automáticamente desde el script; no hace
# falta ponerlos acá.)
cds:
  request_template:
    version: "2_0"
    variable:
      - "precipitation_flux"
      - "reference_evapotranspiration"
    statistic: []
    format: "zip"

# ---------------------------------------------------------------------------
# Mosaico de imágenes NDVI
# ---------------------------------------------------------------------------
# Cada corrida arma un PNG con una miniatura por fecha con pasada útil, para
# ver la evolución espacial del lote. Se guarda en docs/ y lo muestra la
# página. Poner habilitado: false si no se quiere (ahorra ~15 s por corrida).
mapas:
  habilitado: true
  salida: "docs/ndvi_mosaico.png"
  columnas: 4          # 4 columnas x 2 filas = las últimas 8 fechas
  lado_px: 220

# ---------------------------------------------------------------------------
# Notificaciones por Telegram
# ---------------------------------------------------------------------------
# Credenciales por variable de entorno (o Secrets de GitHub):
#   TELEGRAM_BOT_TOKEN   -> token que da @BotFather
#   TELEGRAM_CHAT_ID     -> id del chat/grupo donde mandar el aviso
telegram:
  habilitado: true
  nombre_lote: "lote_6"

  # Cuándo mandar mensaje:
  #   cruce   -> solo cuando el %AU cruza el umbral hacia abajo (recomendado:
  #              evita el mensaje repetido todos los días mientras sigue seco)
  #   deficit -> cada corrida en la que el %AU esté por debajo del umbral
  #   siempre -> cada corrida que procese días nuevos (útil para probar)
  modo: "siempre"

  # Parámetros de la lámina de riego sugerida
  eficiencia_aplicacion: 0.85     # 0.85 = pivote en buenas condiciones. AJUSTAR
                                  # según el sistema real (surcos/aspersión con
                                  # viento suelen estar bastante por debajo).
  reposicion_objetivo_pct: 100    # 100 = reponer hasta capacidad de campo.
                                  # Bajar (ej. 80) para riego deficitario
                                  # controlado.

# ---------------------------------------------------------------------------
# Perfil de suelo desde la Carta de Suelos de Córdoba (IDECOR)
# ---------------------------------------------------------------------------
# Para los lotes sin calicata ni perfil cargado, la corrida consulta las cartas
# 1:50.000 y 1:100.000 en el WFS de Mapas Córdoba y arma el perfil con el agua
# útil a 1, 1,5 y 2 m de las unidades que cruza el lote, ponderadas por
# superficie. Se consulta una vez por polígono (ver src/suelo_carta.py).
indices:
  # Índices espectrales de Sentinel-2 (NDVI, EVI, SAVI, ARVI, GLI, GCI, RGR,
  # SIPI, NBRI y NDRE): serie por pasada despejada y mapas de la última fecha.
  # Usa las mismas credenciales y el mismo enmascarado que el NDVI (sección cdse).
  habilitado: true
  lado_px: 512        # lado mayor de cada mapa

suelo_carta:
  habilitado: true
  url: "https://idecor-ws.mapascordoba.gob.ar/geoserver/idecor/wfs"
  # Si las unidades con dato de agua útil cubren menos que esto del lote
  # (lagunas, zonas urbanas, fuera de las cartas), se usa el perfil por defecto.
  min_cobertura_pct: 50

suelo:
  # Perfil del lote y agua medida en la calicata de siembra.
  # Cargado desde la página el 2026-10-19.
  # Con agua_inicial_mm presente, balance.llenado_inicial_pct se
  # ignora en esa capa.
  - prof_hasta_cm: 20
    cc_porcentaje: 26.8
    pmp_porcentaje: 10.5
    densidad_aparente: 1.25
    agua_inicial_mm: 29.26
  - prof_hasta_cm: 40
    cc_porcentaje: 22.8
    pmp_porcentaje: 9.4
    densidad_aparente: 1.25
    agua_inicial_mm: 31.57
  - prof_hasta_cm: 60
    cc_porcentaje: 21.5
    pmp_porcentaje: 9.2
    densidad_aparente: 1.25
    agua_inicial_mm: 27.24
  - prof_hasta_cm: 80
    cc_porcentaje: 21.5
    pmp_porcentaje: 9.2
    densidad_aparente: 1.25
    agua_inicial_mm: 27.24
  - prof_hasta_cm: 100
    cc_porcentaje: 21.5
    pmp_porcentaje: 9.2
    densidad_aparente: 1.25
    agua_inicial_mm: 24.26
  - prof_hasta_cm: 120
    cc_porcentaje: 21.5
    pmp_porcentaje: 9.2
    densidad_aparente: 1.25
    agua_inicial_mm: 24.26
  - prof_hasta_cm: 140
    cc_porcentaje: 21
    pmp_porcentaje: 9.2
    densidad_aparente: 1.25
    agua_inicial_mm: 22.39
  - prof_hasta_cm: 160
    cc_porcentaje: 21
    pmp_porcentaje: 9.2
    densidad_aparente: 1.25
    agua_inicial_mm: 22.39
  - prof_hasta_cm: 180
    cc_porcentaje: 21
    pmp_porcentaje: 9.2
    densidad_aparente: 1.25
    agua_inicial_mm: 20.92
  - prof_hasta_cm: 200
    cc_porcentaje: 21
    pmp_porcentaje: 9.2
    densidad_aparente: 1.25
    agua_inicial_mm: 20.92

